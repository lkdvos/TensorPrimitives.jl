name: FormatCheck
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

jobs:
  runic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
